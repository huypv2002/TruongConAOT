; ==========================================================
; AutoInstaller Configuration File (Windows 11)
; Tùy chỉnh danh sách ứng dụng, driver, cấu hình hệ thống
; ==========================================================

[General]
ReportPath=C:\Windows\Temp\AutoInstaller_Report.log
CreateDesktopShortcuts=true
EnableLogging=true
RebootAfterInstall=false

[Driver]
; Tự động quét và cài driver bằng Snappy Driver Installer nếu có trên USB
EnableSDI=true
SDIPath=drivers\SDI_x64.exe
SDIArgs=-autoinstall -autoclose

[Tweaks]
EnableDarkMode=true
ShowFileExtensions=true
ShowHiddenFiles=false
AlignTaskbarLeft=true
DisableTelemetry=true
DisableBingSearchInStart=true
DisableBitLocker=true

[Applications]
; Cấu hình: AppKey = Kích_hoạt(true/false) | Mã_Winget_hoặc_Tên_File | Tên_hiển_thị
; Script tự động tải và cài phiên bản sạch, mới nhất từ Microsoft Winget
GoogleChrome=true|Google.Chrome|Google Chrome Standalone
7Zip=true|7zip.7zip|7-Zip Archiver
WinRAR=false|RARLab.WinRAR|WinRAR
VSCode=true|Microsoft.VisualStudioCode|Visual Studio Code
Git=true|Git.Git|Git SCM
Python=true|Python.Python.3.12|Python 3.12
NodeJS=true|OpenJS.NodeJS.LTS|Node.js LTS
Zalo=true|VNG.Zalo|Zalo PC
TeamViewer=false|TeamViewer.TeamViewer|TeamViewer Remote
VLC=true|VideoLAN.VLC|VLC Media Player
NotepadPlusPlus=true|Notepad++.Notepad++|Notepad++
Unikey=true|Unikey.Unikey|UniKey Tiếng Việt
PowerToys=true|Microsoft.PowerToys|Microsoft PowerToys
Discord=false|Discord.Discord|Discord
Telegram=false|Telegram.TelegramDesktop|Telegram Desktop
DockerDesktop=false|Docker.DockerDesktop|Docker Desktop
OfficeODT=false|Microsoft.Office|Microsoft Office 365 / 2024
